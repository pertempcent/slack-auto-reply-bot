name: Run Slack Auto-Reply Bot

on:
  schedule:
    - cron: "*/1 * * * *"  
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  run-bot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure 'data' directory exists
        run: mkdir -p data

      - name: Run bot in background
        run: |
          nohup python src/bot.py > bot.log 2>&1 &  # Start bot in background
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}

      - name: Wait for bot to process messages
        run: sleep 600

      - name: Force add data/tasks.csv and commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -f data/tasks.csv  # Force add the file even though it is in .gitignore
          git commit -m "Update tasks.csv with new Slack messages" || echo "No changes to commit"
          git push origin feature/refactor-cleanup  # Push changes to the feature branch

      - name: Upload logs for debugging
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: bot.log

      - name: Trigger next workflow run
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"event_type": "trigger-next-run"}' \
            https://api.github.com/repos/${{ github.repository }}/dispatches
